<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEBRIANA — Toko Pakaian</title>
    <meta name="description" content="FEBRIANA — toko pakaian online. Katalog, keranjang, dan checkout WhatsApp." />
    <script>
      try {
        var t = localStorage.getItem('febriana-theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
